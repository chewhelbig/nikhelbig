<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Admin — The Psychotherapist</title>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f5;--surface:#fff;--surface2:#f3f0eb;--border:#e2ddd5;--text:#2c2417;--dim:#8a7e6e;--accent:#6b4c2a;--green:#3d7a4f;--red:#a13b3b;--radius:6px;--font:Literata,Georgia,serif;--mono:JetBrains Mono,monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6}
.app{max-width:960px;margin:0 auto;padding:1.5rem}
h1{font-size:1.4rem;margin-bottom:.2rem}
.sub{font-size:.8rem;color:var(--dim);margin-bottom:1.5rem}
.fg{margin-bottom:.8rem}
.fl{display:block;font-size:.72rem;font-weight:600;color:var(--dim);margin-bottom:.2rem}
.fi{width:100%;padding:.5rem .6rem;border:1px solid var(--border);border-radius:var(--radius);font-family:var(--mono);font-size:.8rem;background:var(--bg);color:var(--text);outline:none}
.fi:focus{border-color:var(--accent)}
select.fi{font-family:var(--font)}
.btn{padding:.5rem 1rem;border:none;border-radius:var(--radius);font-family:var(--font);font-size:.8rem;cursor:pointer;display:inline-flex;align-items:center;gap:.3rem}
.btn-p{background:var(--accent);color:#fff}.btn-p:hover{opacity:.9}
.btn-s{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-d{background:var(--red);color:#fff}.btn-d:hover{opacity:.9}
.btn-g{background:var(--green);color:#fff}.btn-g:hover{opacity:.9}
.nav{display:flex;gap:.4rem;margin-bottom:1.2rem;flex-wrap:wrap;align-items:center}
.nav button,.nav select{background:var(--surface);border:1px solid var(--border);color:var(--dim);padding:.4rem .8rem;border-radius:var(--radius);font-size:.75rem;cursor:pointer;font-family:var(--font)}
.nav button.active{border-color:var(--accent);color:var(--accent);background:rgba(107,76,42,.05)}
.row{display:grid;grid-template-columns:50px 1fr auto;gap:.6rem;align-items:center;padding:.55rem .7rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:.35rem;cursor:pointer;transition:border-color .1s}
.row:hover{border-color:var(--accent)}
.row img{width:50px;height:35px;object-fit:cover;border-radius:3px;background:var(--surface2)}
.row .ni{width:50px;height:35px;border-radius:3px;background:var(--surface2)}
.row-t{font-size:.82rem;font-weight:600}
.row-m{font-size:.65rem;color:var(--dim)}
.row-a{display:flex;gap:.25rem}
.row-a button{background:none;border:1px solid var(--border);border-radius:3px;padding:.2rem .4rem;font-size:.63rem;cursor:pointer;color:var(--dim);font-family:var(--font)}
.row-a button:hover{border-color:var(--accent);color:var(--accent)}
.ed-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:.8rem}
.ed-full{grid-column:1/-1}
textarea.ed-body{width:100%;min-height:400px;padding:.8rem;border:1px solid var(--border);border-radius:var(--radius);font-family:var(--mono);font-size:.78rem;line-height:1.6;background:var(--surface);color:var(--text);resize:vertical;outline:none;tab-size:2}
textarea.ed-body:focus{border-color:var(--accent)}
.ed-actions{display:flex;gap:.4rem;margin-top:.8rem;padding-top:.8rem;border-top:1px solid var(--border);align-items:center;flex-wrap:wrap}
.ed-path{font-size:.65rem;color:var(--dim);margin-left:auto}
.toast{position:fixed;bottom:1.2rem;right:1.2rem;background:var(--text);color:#fff;padding:.5rem 1rem;border-radius:var(--radius);font-size:.78rem;opacity:0;transform:translateY(8px);transition:all .25s;z-index:99}
.toast.show{opacity:1;transform:translateY(0)}
.loading{text-align:center;padding:2.5rem;color:var(--dim);font-size:.82rem}
.manual-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;margin-top:1rem}
.manual-box h3{font-size:.95rem;margin-bottom:.5rem}
.manual-box ol{font-size:.82rem;line-height:1.9;margin-left:1.2rem;margin-bottom:1rem}
.manual-box ol a{color:var(--accent);font-weight:600}
.manual-code{width:100%;min-height:200px;padding:.8rem;border:1px solid var(--border);border-radius:var(--radius);font-family:var(--mono);font-size:.72rem;line-height:1.5;background:#fefcf9;color:var(--text);resize:vertical}
.status{font-size:.7rem;color:var(--dim);padding:.5rem 0;border-top:1px solid var(--border);margin-top:1rem}
@media(max-width:600px){.ed-grid{grid-template-columns:1fr}.row{grid-template-columns:1fr auto}}
</style>
</head>
<body>
<div class="app">
<h1>Site Admin</h1>
<p class="sub">Manage articles on nikhelbig.at — Browse, edit, create articles. Changes are saved via GitHub.</p>
<div id="root">
  <div style="max-width:500px;margin:2rem auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem">
    <h2 style="font-size:1.1rem;margin-bottom:.5rem">Load Articles</h2>
    <p style="font-size:.8rem;color:var(--dim);margin-bottom:1rem">Your repo is public, so no token is needed to browse. Click below to load all articles.</p>
    <div class="fg">
      <label class="fl">Repository</label>
      <input type="text" class="fi" id="repoInput" value="chewhelbig/nikhelbig">
    </div>
    <button class="btn btn-p" onclick="doConnect()">Load Articles</button>
    <div id="authLog" style="margin-top:.8rem;font-family:var(--mono);font-size:.7rem;color:var(--dim);white-space:pre-wrap"></div>
  </div>
</div>
</div>
<div class="toast" id="toast"></div>

<script>
const SECTIONS=[
{s:'gestalt-therapy',n:'Gestalt Therapy'},{s:'gestalt-therapy-books',n:'Gestalt Therapy Books'},
{s:'psychotherapy-practice',n:'Psychotherapy Practice'},{s:'psychotherapy-articles',n:'Articles on Psychotherapy'},
{s:'couples-and-family',n:'Couples & Family'},{s:'childhood-trauma',n:'Childhood Trauma'},
{s:'psychoanalysis',n:'Psychoanalysis'},{s:'diagnosis',n:'Diagnosis'},
{s:'neuroscience',n:'Neuroscience'},{s:'cultural-anthropology',n:'Cultural Anthropology'},
{s:'theses-and-publications',n:'Theses & Publications'},{s:'art',n:'Art'},
{s:'lectures',n:'Lectures'},{s:'personality',n:'Personality'},
{s:'therapy-books',n:'Therapy Books'},{s:'general-psychology',n:'General Psychology'}
];

let REPO='chewhelbig/nikhelbig',articles=[],curSection=null;

function log(msg){document.getElementById('authLog').textContent+=msg+'\n'}
function toast(msg,dur=2500){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),dur)}

function parseFM(text){
  const m=text.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
  if(!m)return{meta:{},body:text};
  const meta={};
  m[1].split('\n').forEach(line=>{
    if(line.match(/^tags:\s*\[/)){const tm=line.match(/^tags:\s*\[(.*)\]\s*$/);if(tm)meta.tags=tm[1].replace(/"/g,'').trim();return}
    const kv=line.match(/^(\w[\w_]*):\s*"?(.*?)"?\s*$/);
    if(kv)meta[kv[1]]=kv[2].replace(/^"|"$/g,'');
  });
  return{meta,body:m[2]};
}

function buildFM(meta,body){
  let s='---\n';
  s+=`title: "${(meta.title||'').replace(/"/g,'\\"')}"\n`;
  s+=`date: ${meta.date||new Date().toISOString().split('T')[0]}\n`;
  s+=`draft: false\n`;
  if(meta.description)s+=`description: "${meta.description.replace(/"/g,'\\"')}"\n`;
  if(meta.image)s+=`image: "${meta.image}"\n`;
  if(meta.tags){const t=meta.tags.split(',').map(x=>`"${x.trim()}"`).join(', ');s+=`tags: [${t}]\n`}
  if(meta.original_url)s+=`original_url: "${meta.original_url}"\n`;
  s+='---\n\n';
  return s+body;
}

// === CONNECT (read-only, no auth needed) ===
async function doConnect(){
  REPO=document.getElementById('repoInput').value.trim();
  const authLog=document.getElementById('authLog');
  authLog.textContent='';

  log('Loading articles from '+REPO+'...');
  try{
    await loadArticles();
    log('✓ Loaded '+articles.length+' articles');
    renderApp();
    toast('Loaded '+articles.length+' articles');
  }catch(e){
    log('✗ Error: '+e.message);
  }
}

async function loadArticles(){
  articles=[];
  for(const sec of SECTIONS){
    try{
      const r=await fetch(`https://api.github.com/repos/${REPO}/contents/content/${sec.s}?ref=main`,{mode:'cors'});
      if(!r.ok)continue;
      const files=await r.json();
      for(const f of files){
        if(f.name==='_index.md'||!f.name.endsWith('.md'))continue;
        articles.push({path:f.path,section:sec.s,filename:f.name,sha:f.sha,meta:{title:f.name.replace('.md','').replace(/-/g,' '),date:''},loaded:false});
      }
    }catch(e){}
  }
  // Load front matter in batches
  for(let i=0;i<articles.length;i+=8){
    await Promise.allSettled(articles.slice(i,i+8).map(async a=>{
      try{
        const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${a.path}?ref=main`,{mode:'cors'});
        if(!r.ok)return;
        const d=await r.json();
        const content=atob(d.content.replace(/\n/g,''));
        const{meta}=parseFM(content);
        a.meta=meta;a.sha=d.sha;a.loaded=true;
      }catch(e){}
    }));
  }
}

// === RENDER ===
function renderApp(){
  let secOpts=SECTIONS.map(s=>`<option value="${s.s}">${s.n} (${articles.filter(a=>a.section===s.s).length})</option>`).join('');
  document.getElementById('root').innerHTML=`
    <div class="nav">
      <button class="${!curSection?'active':''}" onclick="curSection=null;renderList()">All (${articles.length})</button>
      <select onchange="curSection=this.value||null;renderList()" id="secSelect">
        <option value="">Filter by section…</option>${secOpts}
      </select>
      <div style="flex:1"></div>
      <button class="btn btn-p" onclick="newArticle()" style="font-size:.75rem">+ New Article</button>
    </div>
    <div id="listArea"></div>
    <div class="status">Repo: ${REPO} · ${articles.length} articles · <a href="https://nikhelbig.at" target="_blank">View site</a> · <a href="https://github.com/${REPO}" target="_blank">GitHub repo</a></div>`;
  if(curSection)document.getElementById('secSelect').value=curSection;
  renderList();
}

function renderList(){
  const list=curSection?articles.filter(a=>a.section===curSection):articles;
  list.sort((a,b)=>(b.meta.date||'').localeCompare(a.meta.date||''));
  let html='';
  list.forEach(a=>{
    const img=a.meta.image?`<img src="https://nikhelbig.at/${a.meta.image}" onerror="this.outerHTML='<div class=ni></div>'">`:'<div class="ni"></div>';
    html+=`<div class="row" onclick="openEditor('${a.path}')">
      ${img}
      <div><div class="row-t">${a.meta.title||a.filename}</div><div class="row-m">${SECTIONS.find(s=>s.s===a.section)?.n||a.section} · ${a.meta.date||'?'}</div></div>
      <div class="row-a" onclick="event.stopPropagation()">
        <button onclick="openEditor('${a.path}')">Edit</button>
        <button onclick="doDelete('${a.path}')">Del</button>
      </div>
    </div>`;
  });
  if(!list.length)html='<div class="loading">No articles in this section</div>';
  document.getElementById('listArea').innerHTML=html;
}

// === EDITOR ===
async function openEditor(path){
  document.getElementById('listArea').innerHTML='<div class="loading">Loading…</div>';
  try{
    const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${path}?ref=main`,{mode:'cors'});
    const d=await r.json();
    const content=atob(d.content.replace(/\n/g,''));
    const{meta,body}=parseFM(content);
    const section=path.split('/')[1];
    showEditor(meta,body,path,d.sha,section,false);
  }catch(e){
    document.getElementById('listArea').innerHTML=`<div class="loading" style="color:var(--red)">Error: ${e.message}</div>`;
  }
}

function newArticle(){
  const section=curSection||'psychotherapy-articles';
  showEditor({title:'',date:new Date().toISOString().split('T')[0],description:'',image:'',tags:''},'',null,null,section,true);
}

function showEditor(meta,body,path,sha,section,isNew){
  let secOpts=SECTIONS.map(s=>`<option value="${s.s}" ${s.s===section?'selected':''}>${s.n}</option>`).join('');
  document.getElementById('listArea').innerHTML=`
    <div style="display:flex;align-items:center;gap:.8rem;margin-bottom:1rem">
      <h2 style="font-size:1rem;flex:1">${isNew?'New Article':'Edit Article'}</h2>
      <button class="btn btn-s" onclick="renderList()">← Back</button>
    </div>
    <div class="ed-grid">
      <div class="fg ed-full"><label class="fl">Title</label><input class="fi" id="eTitle" value="${(meta.title||'').replace(/"/g,'&quot;')}"></div>
      <div class="fg"><label class="fl">Section</label><select class="fi" id="eSection" ${isNew?'':'disabled'}>${secOpts}</select></div>
      <div class="fg"><label class="fl">Date</label><input type="date" class="fi" id="eDate" value="${(meta.date||'').substring(0,10)}"></div>
      <div class="fg ed-full"><label class="fl">Description</label><input class="fi" id="eDesc" value="${(meta.description||'').replace(/"/g,'&quot;')}"></div>
      <div class="fg"><label class="fl">Image path</label><input class="fi" id="eImg" value="${meta.image||''}" placeholder="wp-content/uploads/2023/02/file.jpg"></div>
      <div class="fg"><label class="fl">Tags (comma separated)</label><input class="fi" id="eTags" value="${meta.tags||''}"></div>
    </div>
    <label class="fl">Article Body (Markdown)</label>
    <textarea class="ed-body" id="eBody">${body.replace(/</g,'&lt;')}</textarea>
    <div class="ed-actions">
      <button class="btn btn-g" onclick="doSave('${path||''}','${sha||''}',${isNew})">Save → GitHub</button>
      <button class="btn btn-s" onclick="renderList()">Cancel</button>
      <span class="ed-path">${path||'new file'}</span>
    </div>`;
}

// === SAVE (generates file + opens GitHub editor) ===
function doSave(path,sha,isNew){
  const meta={
    title:document.getElementById('eTitle').value,
    date:document.getElementById('eDate').value,
    description:document.getElementById('eDesc').value,
    image:document.getElementById('eImg').value,
    tags:document.getElementById('eTags').value
  };
  if(!meta.title){toast('Title is required');return}
  const body=document.getElementById('eBody').value;
  const section=document.getElementById('eSection').value;
  const content=buildFM(meta,body);

  if(isNew){
    const slug=meta.title.toLowerCase().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').substring(0,70);
    path=`content/${section}/${slug}.md`;
  }

  const ghEditUrl=isNew
    ?`https://github.com/${REPO}/new/main?filename=${path}&value=${encodeURIComponent(content)}`
    :`https://github.com/${REPO}/edit/main/${path}`;

  document.getElementById('listArea').innerHTML=`
    <div class="manual-box">
      <h3>${isNew?'Create':'Update'}: ${meta.title}</h3>
      <ol>
        <li><strong>Copy</strong> the file content below (click the green button)</li>
        <li><strong>Open</strong> <a href="${ghEditUrl}" target="_blank">GitHub editor for this file ↗</a></li>
        <li>${isNew?'The content should auto-fill. If not, paste it.':'Press <strong>Ctrl+A</strong> (or Cmd+A) to select all, then <strong>Ctrl+V</strong> (Cmd+V) to paste and replace'}</li>
        <li>Click the green <strong>"Commit changes"</strong> button</li>
        <li>Your site will rebuild automatically in ~1-2 minutes</li>
      </ol>
      <button class="btn btn-g" onclick="copyContent()" id="copyBtn">Copy file content to clipboard</button>
      <button class="btn btn-s" onclick="renderList()" style="margin-left:.4rem">← Back to list</button>
      <textarea class="manual-code" id="manualContent" readonly style="margin-top:.8rem">${content.replace(/</g,'&lt;')}</textarea>
    </div>`;
  
  // Store for copying
  document.getElementById('manualContent').dataset.raw=content;
}

function copyContent(){
  const content=document.getElementById('manualContent').dataset.raw;
  navigator.clipboard.writeText(content).then(()=>{
    document.getElementById('copyBtn').textContent='✓ Copied! Now open the GitHub link above';
    toast('Copied to clipboard!');
  }).catch(()=>{
    // Fallback: select the textarea
    const ta=document.getElementById('manualContent');
    ta.select();
    document.execCommand('copy');
    toast('Copied!');
  });
}

// === DELETE ===
function doDelete(path){
  const a=articles.find(x=>x.path===path);
  const title=a?.meta?.title||path;
  if(!confirm(`Delete "${title}"?\n\nYou'll be taken to GitHub to confirm.`))return;
  window.open(`https://github.com/${REPO}/delete/main/${path}`,'_blank');
  toast('Delete page opened in GitHub');
}

// Auto-load
window.addEventListener('DOMContentLoaded',()=>{
  const r=sessionStorage.getItem('gh_repo');
  if(r)document.getElementById('repoInput').value=r;
});
</script>
</body>
</html>
